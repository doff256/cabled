name: Windows

on:
  push:
    paths: ["windows/**", "app/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "app/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

env:
  # vcpkg builds FFmpeg from source (windows/vcpkg.json). Cache the built packages between runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg cache folder
        run: New-Item -ItemType Directory -Force vcpkg-cache | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('windows/vcpkg.json') }}

      # The toolchain is found through VCPKG_INSTALLATION_ROOT (preinstalled on GitHub runners).
      - name: Configure
        run: cmake -S windows -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      # VcamSelftest needs Media Foundation, which Windows Server runners don't install by default.
      # It runs on dev machines (Windows 10/11 desktop) as part of the normal ctest run.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E VcamSelftest

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # WinUI 3 app (C#), linking the cabled_core.dll built above.
      - name: Build app
        run: dotnet build app/Cabled.App/Cabled.App.csproj -c Release

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: cabled-windows-tools
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
            windows/testdata/*.h264

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: cabled-app
          path: app/Cabled.App/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/
