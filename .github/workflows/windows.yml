name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S windows -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      # VcamSelftest needs Media Foundation, which Windows Server runners don't install by default.
      # It runs on dev machines (Windows 10/11 desktop) as part of the normal ctest run.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E VcamSelftest

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: cabled-windows-tools
          path: |
            build/bin/Release/cabled-probe.exe
            build/bin/Release/cabled-fakephone.exe
            build/bin/Release/cabled-vcam.exe
            build/bin/Release/cabled_vcam_mf.dll
