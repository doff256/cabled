# XcodeGen spec. Generate the project with:  cd ios && xcodegen generate
# The generated Cabled.xcodeproj is not committed.
name: Cabled
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Product.xcconfig
  Release: Config/Product.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Cabled:
    type: application
    platform: iOS
    sources:
      - path: Cabled
    settings:
      base:
        PRODUCT_NAME: Cabled
        PRODUCT_MODULE_NAME: Companion
        PRODUCT_BUNDLE_IDENTIFIER: $(CABLED_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(CABLED_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(CABLED_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "$(CABLED_DISPLAY_NAME) sends your camera to your PC over the USB cable, so the PC can use it as a webcam."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ENABLE_PREVIEWS: YES
  CabledTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CabledTests
    dependencies:
      - target: Cabled
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(CABLED_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(CABLED_DEVELOPMENT_TEAM)
schemes:
  Cabled:
    build:
      targets:
        Cabled: all
        CabledTests: [test]
    test:
      targets:
        - CabledTests
